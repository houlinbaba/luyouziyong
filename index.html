<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>路由器面板</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<style>
body{background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;margin:0;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.gridAll{display:block;max-width:760px}
.card{background:#1c1c1e;border-radius:16px;padding:16px;width:100%;box-sizing:border-box;margin-bottom:16px}
.head{display:flex;justify-content:space-between;border-bottom:1px solid #333;padding-bottom:8px}
.remark{width:100%;background:#222;color:#eee;border:1px solid #333;border-radius:6px;padding:6px;margin-top:8px;box-sizing:border-box}
.grid{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.ring{width:90px;height:90px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;color:#4ade80}
.sub{text-align:center;color:#ccc;margin-top:4px;font-size:13px}
.net{margin-top:12px;color:#ddd;font-size:14px}
.off{color:#f87171}.mut{color:#999;font-size:13px}
#termWrap{display:none;margin-top:14px;background:#000;border-radius:12px;padding:10px}
#term{height:420px}
button.termBtn{background:#2a8a3a;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;margin:4px 4px 0 0}
button.delBtn{background:#7f1d1d;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;margin-top:4px}
button.saveBtn{background:#333;color:#eee;border:1px solid #444;border-radius:6px;padding:6px 10px;cursor:pointer}
</style></head><body>
<h1>路由器面板</h1>
<button class="termBtn" style="margin:0 0 12px" onclick="document.getElementById('addForm').style.display=document.getElementById('addForm').style.display=='block'?'none':'block'">＋ 添加主机</button>
<div id="addForm" style="display:none;background:#1c1c1e;border-radius:12px;padding:14px;max-width:760px;margin-bottom:12px">
  <input id="fName" placeholder="主机名，如 副节点 .182" style="padding:8px;margin:4px;width:220px">
  <input id="fHost" placeholder="IP，如 127.0.0.1（走 frp 就填这个）" style="padding:8px;margin:4px;width:260px">
  <input id="fPort" placeholder="端口，如 51149" style="padding:8px;margin:4px;width:120px">
  <input id="fUser" placeholder="账号，默认 root" style="padding:8px;margin:4px;width:140px">
  <input id="fPass" type="password" placeholder="SSH 密码" style="padding:8px;margin:4px;width:180px">
  <input id="fRemark" placeholder="备注，如 主路由 / 客厅" style="padding:8px;margin:4px;width:220px">
  <button class="termBtn" style="margin:4px" onclick="addHost()">保存并添加</button>
  <span id="addMsg" class="mut"></span>
</div>
<div class="gridAll" id="gridAll">加载中…</div>
<div id="termWrap"><div style="margin-bottom:8px"><span id="termTitle"></span> <button class="termBtn" onclick="closeTerm()">关闭终端</button></div><div id="term"></div></div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script>
let hosts=[], term=null, ws=null, termHost=null;
function fmt(n){if(n==null)return "-";const u=["B","K","M","G","T"];let i=0;while(Math.abs(n)>=1000&&i<u.length-1){n/=1000;i++}return i==0?Math.round(n)+" B":n.toFixed(1)+" "+u[i]}
// Display units are decimal (1000-based) like NeoServer, not MiB
// (1024-based): 402472 kB meminfo = 412.1 MB decimal = 393.0 MiB.
// Same bytes, different unit - this was the "412.1M vs 393.0M" gap.
function ring(pct){const r=38,c=2*Math.PI*r,p=pct==null?0:Math.min(100,Math.max(0,pct));return `<div class="ring"><svg width="90" height="90"><circle cx="45" cy="45" r="38" stroke="#2a2a2a" stroke-width="9" fill="none"/><circle cx="45" cy="45" r="38" stroke="#4ade80" stroke-width="9" fill="none" stroke-dasharray="${c*p/100} ${c}"/></svg><div class="n">${pct==null?"-":pct+"%"}</div></div>`}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
async function load(){
  const r=await fetch("/api/hosts"); hosts=await r.json();
  const g=document.getElementById("gridAll");
  if(!hosts.length){g.innerHTML="没有主机了，点“＋ 添加主机”加一个。"; return}
  g.innerHTML=hosts.map(h=>`<div class="card" id="card-${h.id}">
    <div class="head"><b>${esc(h.name)}</b><span id="status-${h.id}" class="mut">…</span></div>
    <input class="remark" id="remark-${h.id}" value="${esc(h.remark||"")}" placeholder="备注：点这里改，改完点保存">
    <div style="margin-top:6px"><button class="saveBtn" onclick="saveRemark('${h.id}')">保存备注</button> <span class="mut" id="rmMsg-${h.id}"></span></div>
    <div id="metrics-${h.id}" class="mut">加载中…</div>
    <div><button class="termBtn" onclick="openTerm('${h.id}')">打开终端</button><button class="delBtn" onclick="deleteHost('${h.id}')">删除此主机</button></div>
  </div>`).join("");
  pollAll();
}
async function pollOne(h){
  const el=document.getElementById("metrics-"+h.id); if(!el) return;
  const r=await fetch("/api/metrics/"+h.id); const m=await r.json();
  const st=document.getElementById("status-"+h.id);
  if(!m.online){st.textContent="离线"; st.className="off"; el.innerHTML=`<p class="off">${esc(m.error||"")}</p><p class="mut">SSH 不通时先在 NeoServer 里确认同一端口能连，再看 frp 隧道是否在线。</p>`; return}
  st.textContent=(m.temp!=null?"🌡 "+m.temp+"°C · ":"")+"在线 · "+(m.uptime||"-")+" · 负载 "+(m.load??"-"); st.className="mut";
  const extra=[m.cpu_model?"CPU："+esc(m.cpu_model):"", m.gateway?"网关："+esc(m.gateway):"", m.os_info?"系统："+esc(m.os_info):""].filter(Boolean).join(" · ");
  el.innerHTML=`${extra?`<div class="mut" style="margin-top:8px">${extra}</div>`:""}<div class="grid">
    <div>${ring(m.cpu_pct)}<div class="sub">CPU<br>${m.cpu_cores?m.cpu_cores+" C":""}</div></div>
    <div>${ring(m.mem_pct)}<div class="sub">Mem<br>${fmt(m.mem_used)} / ${fmt(m.mem_total)}</div></div>
    <div>${ring(m.disk_pct)}<div class="sub">磁盘${m.disk_mount?m.disk_mount:""}<br>${fmt(m.disk_used)} / ${fmt(m.disk_total)}</div></div>
  </div>
  <div class="net"><b>网络</b> ↑ ${fmt(m.net_up)}/s ${fmt(m.net_tx_total)} &nbsp; ↓ ${fmt(m.net_down)}/s ${fmt(m.net_rx_total)}<br>
  <b>I/O</b> ↑ ${fmt(m.io_up)}/s ${fmt(m.io_write_total)} &nbsp; ↓ ${fmt(m.io_down)}/s ${fmt(m.io_read_total)}</div>`;
}
let polling=false;
async function pollAll(){
  // Guard against overlapping polls: a slow SSH poll (router busy,
  // mem ~90%) used to stack up every 3s, exhaust dropbear sessions
  // and flip the card offline/online = flicker. Skip a tick if the
  // previous round is still running.
  if(polling) return; polling=true;
  try{for(const h of hosts) await pollOne(h)} finally{polling=false}
}
async function addHost(){
  const body={name:document.getElementById("fName").value, host:document.getElementById("fHost").value, port:document.getElementById("fPort").value, username:document.getElementById("fUser").value||"root", password:document.getElementById("fPass").value, type:"ssh"};
  const r=await fetch("/api/hosts/add",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json();
  document.getElementById("addMsg").textContent=j.ok?"已添加":("失败："+(j.error||""));
  if(j.ok){const remark=document.getElementById("fRemark").value; if(remark) await fetch("/api/hosts/"+j.id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({remark})}); document.getElementById("addForm").style.display="none"; load()}
}
async function saveRemark(id){
  const v=document.getElementById("remark-"+id).value;
  const r=await fetch("/api/hosts/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({remark:v})});
  const j=await r.json(); document.getElementById("rmMsg-"+id).textContent=j.ok?"已保存":"保存失败";
}
async function deleteHost(id){
  const h=hosts.find(x=>x.id==id); if(!h||!confirm("确定删除 "+h.name+" 吗？")) return;
  const r=await fetch("/api/hosts/"+id,{method:"DELETE"}); const j=await r.json();
  if(!j.ok){alert("删除失败："+(j.error||"")); return}
  if(termHost==id) closeTerm(); load();
}
function openTerm(id){const h=hosts.find(x=>x.id==id); if(!h) return; termHost=id; closeTerm();
  document.getElementById("termWrap").style.display="block"; document.getElementById("termTitle").textContent="终端："+h.name;
  term=new Terminal({cursorBlink:true,theme:{background:"#000000"}}); term.open(document.getElementById("term"));
  ws=new WebSocket((location.protocol=="https:"?"wss://":"ws://")+location.host+"/ws/terminal/"+id);
  ws.onmessage=e=>term.write(e.data); term.onData(d=>ws.send(d));}
function closeTerm(){document.getElementById("termWrap").style.display="none"; try{ws&&ws.close()}catch(e){} if(term){term.dispose();term=null} termHost=null}
load(); setInterval(pollAll,3000);
</script></body></html>
