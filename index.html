<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>路由器面板</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<style>
/* NeoServer card layout, as close as a web page gets:
   - One host card per NeoServer card: header (name + temp/uptime/load
     with icons, no "在线/负载" words eating width), then one row of
     CPU / Mem / 磁盘 / 网络 / I/O, rings coloured by % like the App.
   - Cards are wide enough that nothing truncates: 520px minimum, so
     a wide screen shows 2-3 per row (not 4 cramped 300px cards whose
     network numbers turned into "..."), a phone shows 1 per row.
     4 x 300px cards looked cramped because 5 columns x 60px cannot
     hold "↑ 131.8 K/s" etc. - that was the visual gap in the last
     version, fixed by going wider, not smaller. */
body{background:#000;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;margin:0;padding:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;max-width:1700px;margin-bottom:12px}
h1{font-size:24px;margin:0;font-weight:700}
.addBtn{background:transparent;color:#38bdf8;border:2px solid #38bdf8;border-radius:8px;width:32px;height:32px;font-size:20px;line-height:1;cursor:pointer}
/* Small cards, 4 per row on a wide screen (2 per row under 1300px,
   1 per row on a phone). I/O is rate-only now, network lines are
   short, so a ~380px card fits 5 columns without truncation. */
.gridAll{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:1700px}
@media (max-width:1300px){.gridAll{grid-template-columns:repeat(2,1fr)}}
@media (max-width:650px){.gridAll{grid-template-columns:1fr}}
/* NeoServer card: data boxed in a dark card, clearly separated from the
   black page - darker page, lighter card, visible border + shadow,
   so one host = one obvious dark box, like the circled App card. */
.card{background:#26262b;border:1px solid #3d3d44;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,0.6);padding:10px;box-sizing:border-box;min-width:0}
.mrow{background:#1a1a1e;border:1px solid #2e2e33;border-radius:10px;padding:8px 4px}
.head{display:flex;justify-content:space-between;gap:6px;border-bottom:1px solid #333;padding-bottom:8px}
.head b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px}
.head .st{color:#ccc;font-size:12px;white-space:nowrap}
.remark{width:100%;background:#222;color:#eee;border:1px solid #333;border-radius:6px;padding:6px;margin-top:10px;box-sizing:border-box;font-size:13px}
.mrow{display:flex;gap:6px;margin-top:12px}
.mcol{flex:1 1 0;min-width:0;text-align:center}
.mcol .lbl{color:#fff;font-size:13px;margin-bottom:6px;white-space:nowrap}
.ring{width:52px;height:52px;position:relative;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px}
.sub{color:#ccc;font-size:11px;line-height:1.4;white-space:nowrap}
.netline{color:#ddd;font-size:11px;line-height:1.5;white-space:nowrap}
.off{color:#f87171}.mut{color:#999;font-size:13px}
#termWrap{display:none;margin-top:14px;background:#000;border-radius:12px;padding:10px;max-width:1700px}
#term{height:420px}
button.termBtn{background:#2a8a3a;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;margin:6px 6px 0 0;font-size:13px}
button.delBtn{background:#7f1d1d;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;margin-top:6px;font-size:13px}
button.saveBtn{background:#333;color:#eee;border:1px solid #444;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px}
</style></head><body>
<div class="topbar"><h1>指标</h1><button class="addBtn" onclick="document.getElementById('addForm').style.display=document.getElementById('addForm').style.display=='block'?'none':'block'">+</button></div>
<div id="addForm" style="display:none;background:#26262b;border:1px solid #3d3d44;border-radius:18px;padding:14px;max-width:1700px;margin-bottom:12px">
  <input id="fName" placeholder="主机名，如 副节点 .182" style="padding:8px;margin:4px;width:220px">
  <input id="fHost" placeholder="IP，如 127.0.0.1（走 frp 就填这个，面板在 VPS 本机上，不要填公网 IP）" style="padding:8px;margin:4px;width:340px">
  <input id="fPort" placeholder="端口，如 51149" style="padding:8px;margin:4px;width:120px">
  <input id="fUser" placeholder="账号，默认 root" style="padding:8px;margin:4px;width:140px">
  <input id="fPass" type="password" placeholder="SSH 密码" style="padding:8px;margin:4px;width:180px">
  <input id="fRemark" placeholder="备注，如 主路由 / 客厅" style="padding:8px;margin:4px;width:220px">
  <button class="termBtn" style="margin:4px" onclick="addHost()">保存并添加</button>
  <span id="addMsg" class="mut"></span>
</div>
<div class="gridAll" id="gridAll">加载中…</div>
<div id="termWrap"><div style="margin-bottom:8px"><span id="termTitle"></span> <button class="termBtn" onclick="closeTerm()">关闭终端</button></div><div id="term"></div></div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script>
let hosts=[], term=null, ws=null, termHost=null;
function fmt(n){if(n==null)return "-";const u=["B","K","M","G","T"];let i=0;while(Math.abs(n)>=1000&&i<u.length-1){n/=1000;i++}return i==0?Math.round(n)+" B":n.toFixed(1)+" "+u[i]}
// Display units are decimal (1000-based) like NeoServer, not MiB:
// 402472 kB meminfo = 412.1 MB decimal = 393.0 MiB.
function ringColor(pct){if(pct==null)return "#4ade80";if(pct>=80)return "#f87171";if(pct>=60)return "#fb923c";return "#4ade80"}
function ring(pct){const r=22,c=2*Math.PI*r,p=pct==null?0:Math.min(100,Math.max(0,pct)),col=ringColor(pct);return `<div class="ring"><svg width="52" height="52"><circle cx="26" cy="26" r="22" stroke="#2a2a2a" stroke-width="6" fill="none"/><circle cx="26" cy="26" r="22" stroke="${col}" stroke-width="6" fill="none" stroke-dasharray="${c*p/100} ${c}"/></svg><div class="n" style="color:${col}">${pct==null?"-":pct+"%"}</div></div>`}
function hostIcon(type){if(type=="local")return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f472b6" stroke-width="2"><rect x="3" y="4" width="18" height="10" rx="2"/><circle cx="7" cy="9" r="1" fill="#f472b6"/><line x1="3" y1="18" x2="21" y2="18"/><line x1="8" y1="21" x2="16" y2="21"/></svg>`;return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path d="M2 9a15 15 0 0 1 20 0"/><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8 15a5 5 0 0 1 8 0"/><circle cx="12" cy="18" r="1.5" fill="#38bdf8"/></svg>`}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
async function load(){
  const r=await fetch("/api/hosts"); hosts=await r.json();
  const g=document.getElementById("gridAll");
  if(!hosts.length){g.innerHTML="没有主机了，点“＋ 添加主机”加一个。"; return}
  g.innerHTML=hosts.map(h=>`<div class="card" id="card-${h.id}">
    <div class="head"><b>${hostIcon(h.type)}${esc(h.name)}</b><span class="st" id="status-${h.id}">…</span></div>
    <div id="metrics-${h.id}" class="mut">加载中…</div>
    <div><button class="termBtn" onclick="openTerm('${h.id}')">打开终端</button><button class="delBtn" onclick="deleteHost('${h.id}')">删除此主机</button></div>
  </div>`).join("");
  pollAll();
}
async function pollOne(h){
  const el=document.getElementById("metrics-"+h.id); if(!el) return;
  const r=await fetch("/api/metrics/"+h.id); const m=await r.json();
  const st=document.getElementById("status-"+h.id);
  if(!m.online){st.textContent="离线"; st.style.color="#f87171"; el.innerHTML=`<p class="off">${esc(m.error||"")}</p><p class="mut">SSH 不通时先在 NeoServer 里确认同一端口能连，再看 frp 隧道是否在线。面板在 VPS 本机上，IP 必须填 127.0.0.1，不要填公网 IP。</p>`; return}
  // NeoServer header: temp + uptime + load, with icons, no "在线/负载" words.
  // Temp is absent on hosts with no sensor (e.g. the VPS) - same as the App.
  st.textContent=(m.temp!=null?"🌡"+m.temp+"°C ":"")+"⏻"+(m.uptime||"-")+" 📈"+(m.load??"-"); st.style.color="#ccc";
  el.innerHTML=`<div class="mrow">
    <div class="mcol"><div class="lbl">CPU</div>${ring(m.cpu_pct)}<div class="sub">${m.cpu_cores?m.cpu_cores+" C":""}</div></div>
    <div class="mcol"><div class="lbl">Mem</div>${ring(m.mem_pct)}<div class="sub">${fmt(m.mem_total)}</div></div>
    <div class="mcol"><div class="lbl">磁盘</div>${ring(m.disk_pct)}<div class="sub">${fmt(m.disk_total)}</div></div>
    <div class="mcol" title="${m.net_iface?esc(m.net_iface):""}"><div class="lbl">网络</div><div class="netline">↑ ${fmt(m.net_up)}/s</div><div class="netline">${fmt(m.net_tx_total)}</div><div class="netline">↓ ${fmt(m.net_down)}/s</div><div class="netline">${fmt(m.net_rx_total)}</div></div>
    <div class="mcol"><div class="lbl">I/O</div><div class="netline">↑ ${fmt(m.io_up)}/s</div><div style="height:16.5px"></div><div class="netline">↓ ${fmt(m.io_down)}/s</div></div>
  </div>`;
}
let polling=false;
async function pollAll(){
  if(polling) return; polling=true;
  try{for(const h of hosts) await pollOne(h)} finally{polling=false}
}
async function addHost(){
  const body={name:document.getElementById("fName").value, host:document.getElementById("fHost").value, port:document.getElementById("fPort").value, username:document.getElementById("fUser").value||"root", password:document.getElementById("fPass").value, type:"ssh"};
  const r=await fetch("/api/hosts/add",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json();
  document.getElementById("addMsg").textContent=j.ok?"已添加":("失败："+(j.error||""));
  if(j.ok){const remark=document.getElementById("fRemark").value; if(remark) await fetch("/api/hosts/"+j.id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({remark})}); document.getElementById("addForm").style.display="none"; load()}
}
async function saveRemark(id){
  const v=document.getElementById("remark-"+id).value;
  const r=await fetch("/api/hosts/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({remark:v})});
  const j=await r.json(); document.getElementById("rmMsg-"+id).textContent=j.ok?"已保存":"保存失败";
}
async function deleteHost(id){
  const h=hosts.find(x=>x.id==id); if(!h||!confirm("确定删除 "+h.name+" 吗？")) return;
  const r=await fetch("/api/hosts/"+id,{method:"DELETE"}); const j=await r.json();
  if(!j.ok){alert("删除失败："+(j.error||"")); return}
  if(termHost==id) closeTerm(); load();
}
function openTerm(id){const h=hosts.find(x=>x.id==id); if(!h) return; termHost=id; closeTerm();
  document.getElementById("termWrap").style.display="block"; document.getElementById("termTitle").textContent="终端："+h.name;
  term=new Terminal({cursorBlink:true,theme:{background:"#000000"}}); term.open(document.getElementById("term"));
  ws=new WebSocket((location.protocol=="https:"?"wss://":"ws://")+location.host+"/ws/terminal/"+id);
  ws.onmessage=e=>term.write(e.data); term.onData(d=>ws.send(d));}
function closeTerm(){document.getElementById("termWrap").style.display="none"; try{ws&&ws.close()}catch(e){} if(term){term.dispose();term=null} termHost=null}
load(); setInterval(pollAll,3000);
</script></body></html>
